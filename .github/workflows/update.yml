name: Päivitä data

# Fetches fresh data from Statistics Finland, Finnish Customs and the ECB, commits the JSON
# files when something changed, and publishes the site on GitHub Pages.
#
# Statistics Finland publishes at 08:00 Finnish time = 05:00 UTC in summer, 06:00 UTC in
# winter, so the morning runs cover both. The evening run comes after the Helsinki stock
# exchange closes (18:30 Finnish time) and also picks up Customs and ECB data.
#
# Scheduled runs always use the default branch. Pushes only rebuild the site, and only for the
# default branch, whatever it is called.
on:
  schedule:
    - cron: '15 5 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '50 16 * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'public/data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Commit changed data
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: päivitys $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    # Requires Pages to be enabled once: Settings → Pages → Source: GitHub Actions.
    # To stop publishing, set the repository variable DEPLOY_PAGES to "false".
    # (Scheduled runs always use the default branch; their event payload has no repository info.)
    needs: data
    if: >-
      always() && vars.DEPLOY_PAGES != 'false' &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) &&
      (needs.data.result == 'skipped' || (needs.data.result == 'success' &&
      (needs.data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, so the data commit made by the previous job is included.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
